name: Security scan (report-only)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # The gitleaks GitHub Action requires a paid licence key for repositories
      # owned by an organisation, so every run failed on "missing gitleaks
      # license" regardless of the diff. The scanner itself is MIT licensed, so
      # install the release binary and call it directly.
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        shell: bash
        run: |
          set -uo pipefail
          # Exits non-zero when a secret is found. The job stays report-only
          # through continue-on-error above, as it was with the action.
          gitleaks dir . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Summarise findings
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os

          print("## gitleaks (report-only)\n")
          try:
              findings = json.load(open("gitleaks-report.json"))
          except Exception:
              print("The scan did not produce a report.")
              raise SystemExit(0)

          if not findings:
              print("No secrets detected in the working tree.")
              raise SystemExit(0)

          print(f"**{len(findings)} potential secret(s) detected.** Values are "
                "redacted here; the full report is attached as an artifact.\n")
          print("| Rule | File | Line |")
          print("| --- | --- | --- |")
          for f in findings[:50]:
              print(f"| {f.get('RuleID', '')} | `{f.get('File', '')}` | {f.get('StartLine', '')} |")
          if len(findings) > 50:
              print(f"\n...and {len(findings) - 50} more.")
          PY

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  semgrep:
    name: semgrep (sast)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run semgrep (report-only)
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "auto"
