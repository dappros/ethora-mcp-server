# HOL Plugin Scanner (hashgraph-online/hol-guard): the same scan the
# Awesome AI Plugins catalog runs centrally, so a regression shows up here
# first. Read-only, no secrets, pinned to commit SHAs as the catalog's
# SCANNER_GUIDE.md recommends. Run it locally with:
#   pipx run plugin-scanner scan . --format text
name: Plugin Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
