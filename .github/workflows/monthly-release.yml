name: Monthly release

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Check for commits in the previous month
        id: check
        shell: bash
        run: |
          # Calendar versioning, but valid semver: year.month.patch.
          # `date +%y.%m` produced things like "26.09" and "26.10", which are
          # not semver (two components, and a leading zero), so npm refused to
          # publish them. %-m drops the leading zero and .0 supplies a patch.
          VERSION="$(date -u +'%y.%-m').0"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

          SINCE="$(date -u -d '1 month ago' +'%Y-%m-01')"
          UNTIL="$(date -u +'%Y-%m-01')"

          COUNT="$(git rev-list --count --since="${SINCE}" --until="${UNTIL}" HEAD)"
          echo "commit_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Commits in previous month (${SINCE} to ${UNTIL}): ${COUNT}"

          if [ "${COUNT}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        id: notes
        shell: bash
        run: |
          SINCE="$(date -u -d '1 month ago' +'%Y-%m-01')"
          UNTIL="$(date -u +'%Y-%m-01')"
          PREV_MONTH="$(date -u -d '1 month ago' +'%B %Y')"

          {
            echo "body<<RELEASE_EOF"
            echo "## What's new in ${PREV_MONTH}"
            echo ""
            echo "${{ steps.check.outputs.commit_count }} commits since last release:"
            echo ""
            git log --since="${SINCE}" --until="${UNTIL}" --format="- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" HEAD
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump the version and sync every manifest
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          npm pkg set version="${VERSION}"
          # server.json, .plugin/plugin.json and the serverInfo in src/index.ts
          # all carry the version too. Skipping this is how they ended up
          # reporting 26.5.3 while package.json said otherwise.
          npm run sync-version
          npm install --package-lock-only

      - name: Create tag and release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.check.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json server.json .plugin/plugin.json src/index.ts 2>/dev/null || true
          git commit -m "chore: bump version to ${{ steps.check.outputs.tag }}" || true
          git push origin HEAD:main

          git tag "${TAG}"
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "${{ steps.notes.outputs.body }}"

          echo "Created release ${TAG}"

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # the publish workflow is called directly rather than listening for the
  # release event.
  publish:
    needs: release
    if: needs.release.outputs.skip == 'false'
    uses: ./.github/workflows/publish.yml
    with:
      ref: v${{ needs.release.outputs.version }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit
